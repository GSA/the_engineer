# Preparation only. Read context/engineering-memory.md before any launch.
name: engineer-hindsight

services:
  hindsight:
    profiles: [hindsight]
    image: ghcr.io/vectorize-io/hindsight-api:1.1.0@sha256:cdfeb26e92ad33d54a8a7e4cfe6e67b55d619f25ea5f5bba0a3281d701a82b36
    pull_policy: never
    restart: "no"
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:18888:8888"
    env_file:
      - path: ${HINDSIGHT_PRIVATE_ENV:?Select an approved private runtime env file}
        required: true
        format: raw
    environment:
      HINDSIGHT_ENABLE_API: "true"
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_HOST: "0.0.0.0"
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_DATABASE_URL: ""
      HINDSIGHT_API_DATABASE_SCHEMA: public
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_MCP_AUTH_DISABLED: "false"
      HINDSIGHT_API_MCP_ENABLED: "false"
      HINDSIGHT_API_MCP_AUTH_TOKEN: ""
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:?Approve the extraction provider}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:?Approve the extraction model}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:?Approve the extraction endpoint}
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: ${HINDSIGHT_EMBEDDINGS_LOCAL_MODEL:?Approve the bundled local embedding model}
      HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_EMBEDDINGS_LOCAL_TRUST_REMOTE_CODE: "false"
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: ${HINDSIGHT_RERANKER_LOCAL_MODEL:?Approve the bundled local reranker}
      HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_RERANKER_LOCAL_TRUST_REMOTE_CODE: "false"
      HINDSIGHT_API_DECISION_MODEL_PROVIDER: none
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "false"
      HINDSIGHT_API_ENABLE_FILE_UPLOAD_API: "false"
      HINDSIGHT_API_LLM_TRACE_ENABLED: "false"
      HINDSIGHT_API_LLM_DEBUG_DUMP_4XX: "false"
      HINDSIGHT_API_OTEL_TRACES_ENABLED: "false"
      HINDSIGHT_API_AUDIT_LOG_ENABLED: "false"
      HINDSIGHT_API_ACCESS_LOG: "false"
      HINDSIGHT_API_LOG_LEVEL: warning
      HINDSIGHT_API_LLM_HTTP_LOG_LEVEL: WARNING
    volumes:
      - type: volume
        source: data
        target: /home/hindsight/.pg0
    healthcheck:
      test: [CMD, python3, -m, hindsight_api.http_probe, "http://127.0.0.1:8888/health", "5"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

volumes:
  data:
    external: true
    name: ${HINDSIGHT_DATA_VOLUME:?Select a precreated approved private volume}
